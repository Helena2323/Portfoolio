<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helena tutvustus</title>

    <style>

            font-family: Arial, sans-serif;
            background-color: #f8e9ed;

        }

        .leht {
            background-color: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;

        h1 {
            color: #a64d68;
        }

        h2 {
            color: #c06c84;
        }

        img {
            width: 250px;
            border-radius: 15px;
            margin: 10px;
        }

        li {
            margin: 8px;
        }

        a {
            color: #a64d68;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="leht">

        <h1>Tere! Mina olen Helena</h1>

        <img src="helena.jpg" alt="Helena pilt">

        <h2>Minust</h2>

        <p>
            Olen sõbralik, kohusetundlik ja õpihimuline.
            Mulle meeldib reisida ja värskes õhus viibida.
        </p>

        <h2>Minu hobid ja huvid</h2>

        <ul>
            <li>Reisimine</li>
            <li>Värskes õhus viibimine</li>
            <li>Uute kohtade avastamine</li>
            <li>Uute asjade õppimine</li>
        </ul>

        <h2>Link</h2>

        <p>
            <a href="https://www.google.com" target="_blank">

            </a>

</html>
